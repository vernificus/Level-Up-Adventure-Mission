<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gamepad.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7FB" />
    <title>Level Up: Adventure Mission</title>
    <meta name="description" content="An interactive choice board for 5th grade students to choose their learning path" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lvlup_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#1B2340');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" role="application" aria-label="Level Up: Adventure Mission"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
